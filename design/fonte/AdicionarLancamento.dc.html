<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Adicionar lançamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dk{--bg:#0B1411;--sf:#12201C;--sf2:#182B26;--tx:#EEF8F4;--mu:#93A8A0;--ln:#243A33;--br:#19D9A0;--brs:rgba(25,217,160,.14);--brx:#19D9A0;--wa:#F5B544;--was:rgba(245,181,68,.15)}
.lt{--bg:#F4F7F6;--sf:#FFFFFF;--sf2:#EAF2EF;--tx:#0F1E1A;--mu:#56665F;--ln:#D9E3DF;--br:#00C896;--brs:#DDF5EC;--brx:#00755A;--wa:#9A6400;--was:#FCEFD6}
.scr{width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;padding:28px 20px 24px;gap:16px;overflow:hidden}
h1{margin:0;font-size:28px;line-height:1.12;letter-spacing:-.8px;font-weight:800}
h2{margin:0;font-size:17px;font-weight:700}
p{margin:0;font-size:15px;line-height:1.45}
.mu{color:var(--mu)}.gt{color:var(--brx)}.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--br);color:#05241B;font-weight:700;font-size:16px;text-decoration:none;border:0;font-family:inherit}
.btn2{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;background:transparent;border:1px solid var(--ln);color:var(--tx);font-weight:600;font-size:15px;text-decoration:none;font-family:inherit}
.lnk{color:var(--brx);font-weight:600;font-size:14px;text-decoration:none;text-align:center}
.fld{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:600;color:var(--mu)}
input{height:48px;box-sizing:border-box;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0 14px;font-family:inherit;font-size:16px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--ln);font-size:14px;font-weight:600;background:var(--sf);color:var(--tx);font-family:inherit}
.on{background:var(--brs);border-color:var(--br);color:var(--brx)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--brs);color:var(--brx)}
.warn{background:var(--was);color:var(--wa)}
.bar{height:6px;border-radius:6px;background:var(--sf2);display:flex}.bar div{height:6px;border-radius:6px;background:var(--br)}
.sp{flex-grow:1}
.hint{font-size:12px;color:var(--mu);line-height:1.4}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ln);margin:0 -20px -24px;padding:10px 4px 14px;background:var(--sf)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu)}
.nav .a{color:var(--brx)}
.top{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);display:grid;place-items:center;text-decoration:none}
.big{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1}
.ico{width:40px;height:40px;border-radius:12px;background:var(--brs);color:var(--brx);display:grid;place-items:center;flex-shrink:0}
.sw{width:52px;height:32px;border-radius:16px;background:var(--sf2);border:1px solid var(--ln);display:flex;align-items:center;padding:3px;box-sizing:border-box;flex-shrink:0;font-family:inherit}
.sw i{width:24px;height:24px;border-radius:12px;background:var(--mu);display:block}
.sw.ligado{background:var(--br);border-color:var(--br);justify-content:flex-end}.sw.ligado i{background:#05241B}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 0;text-decoration:none;color:var(--tx);border-bottom:1px solid var(--ln);font-size:15px}
.li:last-child{border-bottom:0}.li .v{color:var(--mu);font-size:14px;margin-left:auto;text-align:right}
.sec{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);margin-top:4px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);display:grid;place-items:center;text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sf2);border-radius:12px;padding:4px;gap:4px}
.seg span{text-align:center;padding:8px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu)}.seg .a{background:var(--sf);color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.k b{font-size:19px}.scroll{overflow:hidden;display:flex;flex-direction:column;gap:14px;flex-grow:1;min-height:0}
.avatar{width:72px;height:72px;border-radius:36px;background:var(--brs);color:var(--brx);display:grid;place-items:center;font-size:26px;font-weight:800}
.ride{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.cb{width:22px;height:22px;border-radius:6px;background:var(--br);color:#05241B;display:grid;place-items:center;flex-shrink:0}

</style>
</helmet>
<div class="scr {{th}}">
<div class="top"><a class="back" href="Financeiro.dc.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div style="flex-grow:1;display:flex;flex-direction:column;gap:6px"><h2>Novo lançamento</h2></div></div>
<div class="chips"><button class="chip on">Combustível</button><button class="chip">KM do dia</button><button class="chip">Manutenção</button><button class="chip">Despesa</button></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label>Litros</label><input value="21,46"></div><div class="fld"><label>Preço/litro</label><input value="6,99"></div></div>
<div class="fld"><label>Valor total (R$)</label><input value="150,00"><div class="hint">Preencha 2 dos 3 campos; o terceiro é calculado.</div></div>
<div class="fld"><label>KM do painel</label><input value="129.602"><div class="hint">Anterior: 129.456 (+146 km)</div></div>
<div class="row"><span style="font-weight:600">Tanque cheio?</span><button class="sw ligado" aria-label="Tanque cheio"><i></i></button></div>
<div class="hint">Com dois tanques cheios seguidos, calculamos seu consumo real.</div>
<div class="card" style="gap:8px"><div class="row"><h2>KM rodados reais do dia</h2></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div class="fld"><label>KM inicial</label><input value="129.456"></div><div class="fld"><label>KM final</label><input value="129.602"></div></div><div class="hint">146 km no dia. KM fora do horário de trabalho conta como uso pessoal.</div></div>
<div class="sp"></div><a class="btn" href="Financeiro.dc.html">Salvar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["escuro","claro"],"default":"escuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

renderVals() {

return { th: (this.props.tema ?? 'escuro') === 'claro' ? 'lt' : 'dk' };
}
}
</script>
</body>
</html>
